# Oxidized configuration — sanitized example
#
# Lives at /opt/oxidized/.config/oxidized/config on CA-OXI-LAB, mode 0600,
# owned by the `oxidized` service user. Never committed anywhere.
#
# Oxidized 0.37.0 / Ruby 3.1 / Debian 12.
---
# No global username/password. Credentials are per node, in router.db, and
# every node uses the read-only TACACS+ service account. The global pair that
# used to sit here was the fleet admin password — deleted once no node needed
# it, and only after confirming all six still backed up without it.
model: ios
interval: 3600          # seconds. Commits happen only on change, so a short
                        # interval adds detection speed, not noise.
use_syslog: false
debug: false            # true resolves and LOGS every node key, password
                        # included. Never leave it on.
threads: 4
timeout: 600            # was 30. The PA-440's `show config running` includes
                        # the whole App-ID catalogue and takes 39-50 s; at 30 it
                        # failed silently, retried, and gave up. A stopgap —
                        # it means a real failure takes 10 minutes to report.
retries: 3
prompt: !ruby/regexp /^([\w.@-]+[#>]\s?)$/

vars:
  remove_secret: true   # per-model regex redaction of password 7, SNMP
                        # communities, etc. A convenience, not a guarantee.

input:
  default: ssh
  debug: false          # true writes full session transcripts to
                        # ~/.config/oxidized/logs/ — useful while diagnosing
  ssh:
    secure: false       # disables host-key verification. Acceptable on an
                        # isolated management VLAN; pre-populate known_hosts
                        # instead in production.

output:
  default: git
  git:
    user: oxidized
    email: oxidized@casey.corp
    repo: "/opt/oxidized/configs.git"
    # NOTE: remote_repo is NOT an output key. Setting it here does nothing.
    # Pushing is done by the hook below.

source:
  default: csv
  csv:
    file: /opt/oxidized/.config/oxidized/router.db
    delimiter: !ruby/regexp /:/
    map:
      name: 0
      model: 1
      ip: 2
      username: 3
      password: 4

models:
  eos:
    vars:
      # Arista EOS lands in unprivileged mode; the model needs enable to reach
      # `show running-config`. Must be a real YAML boolean — the model tests
      # is_a?(TrueClass), so a string from the CSV source would not match.
      enable: true
      # EOS offers keyboard-interactive but NOT the `password` auth method.
      # Oxidized's default list is [none, publickey, password], which fails
      # with AuthenticationFailed before ever reaching a prompt.
      auth_methods: [none, publickey, password, keyboard-interactive]

extensions:
  oxidized-web:
    load: true          # newer oxidized-web needs this; without it the gem is
                        # installed, configured, and silently never starts
    listen: 127.0.0.1   # NO AUTHENTICATION, and it serves every device config.
                        # Was 0.0.0.0; local-only still lets a monitoring agent
                        # on this host poll /nodes.json for status and duration.
    port: 8888

hooks:
  push_to_gitea:
    type: exec
    events: [post_store]      # fires only when a config actually changed
    cmd: 'git -C /opt/oxidized/configs.git push origin master'
    async: false
    timeout: 120        # governs the git push, NOT SSH to devices — the one
                        # that matters for slow devices is the top-level key
    # Uses the git binary and the oxidized user's ~/.ssh/id_ed25519, which is
    # registered in Gitea as a write-enabled deploy key scoped to one repo.
    # The built-in `githubrepo` hook was not used: it pushes through
    # rugged/libgit2, which was compiled without SSH transport, and rebuilding
    # it with --with-ssh failed at link time and broke the git output. See
    # docs/troubleshooting.md.
